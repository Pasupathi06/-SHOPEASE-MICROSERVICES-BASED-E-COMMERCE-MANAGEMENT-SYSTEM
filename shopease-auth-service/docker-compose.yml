version: '3.8'

services:
  # 1. Authentication MySQL 8 Database Service
  auth-db:
    image: mysql:8.0
    container_name: shopease-auth-db
    restart: always
    environment:
      MYSQL_DATABASE: shopease_auth_db
      MYSQL_USER: pasu
      MYSQL_PASSWORD: pasupathi@123
      MYSQL_ROOT_PASSWORD: pasupathi@123
    ports:
      - "3307:3306"
    volumes:
      - auth_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppasupathi@123"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - shopease-network

  # 2. Authentication FastAPI Microservice
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopease-auth-container
    restart: always
    ports:
      - "8001:8001"
    environment:
      - PROJECT_NAME=ShopEase Auth Service
      - PORT=8001
      - HOST=0.0.0.0
      - MYSQL_HOST=auth-db
      - MYSQL_PORT=3306
      - MYSQL_USER=pasu
      - MYSQL_PASSWORD=pasupathi@123
      - MYSQL_DATABASE=shopease_auth_db
      - DATABASE_URL=mysql+pymysql://pasu:pasupathi%40123@auth-db:3306/shopease_auth_db
      - JWT_SECRET_KEY=shopease_jwt_super_secret_key_pasupathi_2026_secure_hash_key_123
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - shopease-network

volumes:
  auth_db_data:
    driver: local

networks:
  shopease-network:
    driver: bridge
