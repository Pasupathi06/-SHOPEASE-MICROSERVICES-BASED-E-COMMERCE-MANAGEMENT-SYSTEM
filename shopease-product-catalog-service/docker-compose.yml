version: '3.8'

services:
  catalog-db:
    image: mysql:8.0
    container_name: shopease-catalog-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: pasupathi@123
      MYSQL_DATABASE: shopease_product_catalog_db
      MYSQL_USER: pasu
      MYSQL_PASSWORD: pasupathi@123
    ports:
      - "3309:3306"
    volumes:
      - catalog_db_data:/var/lib/mysql
    networks:
      - shopease-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "pasu", "-ppasupathi@123"]
      interval: 10s
      timeout: 5s
      retries: 5

  catalog-service:
    build: .
    container_name: shopease-product-catalog-service
    restart: always
    ports:
      - "8004:8004"
    environment:
      - PROJECT_NAME=ShopEase Product Catalog Service
      - PROJECT_VERSION=1.0.0
      - HOST=0.0.0.0
      - PORT=8004
      - MYSQL_HOST=catalog-db
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=shopease_product_catalog_db
      - MYSQL_USER=pasu
      - MYSQL_PASSWORD=pasupathi@123
      - DATABASE_URL=mysql+pymysql://pasu:pasupathi%40123@catalog-db:3306/shopease_product_catalog_db
      - JWT_SECRET_KEY=shopease_jwt_super_secret_key_pasupathi_2026_secure_hash_key_123
      - JWT_ALGORITHM=HS256
      - DEFAULT_LOW_STOCK_THRESHOLD=10
    depends_on:
      catalog-db:
        condition: service_healthy
    networks:
      - shopease-network

volumes:
  catalog_db_data:

networks:
  shopease-network:
    driver: bridge
